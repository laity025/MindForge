# ============================================================
#  Render Blueprint - free tier deployment for MindForge
#  Docs: https://render.com/docs/blueprint-spec
# ============================================================
#  How to use:
#    1. Push this repo to GitHub.
#    2. Render Dashboard -> New -> Blueprint -> pick the repo.
#    3. Render reads this file and asks for LLM_API_KEY once
#       (because sync: false means "do not store in git").
#    4. Free plan: 512MB RAM / 0.1 CPU, sleeps after 15 min idle.
# ============================================================
services:
  - type: web
    name: mindforge
    runtime: docker
    plan: free
    # Singapore is the closest free region to mainland China
    # (alternatives: oregon / ohio / virginia / frankfurt)
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Secret: entered in the Render UI, never committed ---
      - key: LLM_API_KEY
        sync: false

      # --- LLM endpoint. Default here is ModelScope's free
      #     OpenAI-compatible inference API (2000 requests/day free,
      #     needs an Alibaba Cloud account bound + real-name verified).
      #     Switch to DeepSeek / Qwen / SiliconFlow by editing these.
      #
      #     Model ids served by the free inference API change over time.
      #     The live list is PUBLIC (no auth needed) - open this in a
      #     browser, or: curl https://api-inference.modelscope.cn/v1/models
      #     Verified 2026-09-23: deepseek-ai/DeepSeek-V3 is NO LONGER
      #     served; the V4 generation replaced it.
      - key: LLM_BASE_URL
        value: https://api-inference.modelscope.cn/v1
      - key: FAST_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: STRONG_MODEL
        value: deepseek-ai/DeepSeek-V4-Pro

      # Frontend is served same-origin by this very service,
      # so CORS is not strictly needed. Tighten if you split hosts.
      - key: CORS_ORIGINS
        value: "*"

      # TIMEOUT_MS drives every LLM HTTP timeout (services/llm_client.py):
      #   streaming  -> per-read-gap ceiling = TIMEOUT_MS/1000 + 5
      #   non-stream -> whole-response ceiling = TIMEOUT_MS/1000 + 10
      # The analyst report is a single non-stream call to STRONG_MODEL and
      # needs to generate a full structured JSON, so a small value makes it
      # silently fall back to the local mock report. 30000 => 40s ceiling.
      - key: TIMEOUT_MS
        value: "30000"
      - key: MAX_TURNS
        value: "40"
      - key: MAX_DURATION_MIN
        value: "20"
